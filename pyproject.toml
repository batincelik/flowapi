[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowapi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13", "argon2-cffi>=23.1", "asyncpg>=0.29", "croniter>=6", "cryptography>=42", "fastapi>=0.115",
  "h11>=0.16", "httpx>=0.27", "lark>=1.1", "pydantic-settings>=2.5", "redis>=5",
  "sqlalchemy[asyncio]>=2.0", "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/flowapi"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
